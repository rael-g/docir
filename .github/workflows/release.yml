name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig build test
      - run: zig build
      - run: test "docir ${GITHUB_REF_NAME#v}" = "$(zig-out/bin/docir --version)"
      - id: notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
      - env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ steps.notes.outputs.changelog }}
        run: |
          if [ "$(git tag --list 'v*' | wc -l)" = 1 ]; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "Initial release."
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$NOTES"
          fi
